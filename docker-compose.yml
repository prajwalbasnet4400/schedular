services:
  postgres:
    image: postgres:16-alpine
    container_name: schedular-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schedular
      POSTGRES_PASSWORD: schedular
      POSTGRES_DB: schedular
    ports:
      - "5433:5432"
    volumes:
      - schedular-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedular -d schedular"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schedular-pgdata:
